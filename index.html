
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#090e1b">
    <title>Faiz Code Studio</title>

    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <header class="topbar">
        <div class="brand">
            <div class="brand-icon">F</div>
            <div>
                <h1>Faiz Code Studio</h1>
                <p>Mobile Code Editor</p>
            </div>
        </div>

        <div class="top-actions">
            <button id="runBtn" class="run-btn">▶ Jalankan</button>
        </div>
    </header>

    <main class="workspace" id="workspace">

        <section class="editor-panel">

            <div class="editor-toolbar">
                <button id="fileMenuBtn" class="tool-btn" title="File Explorer">
                    ☰
                </button>

                <div class="breadcrumb">
                    <span>PROJECT</span>
                    <span>/</span>
                    <strong id="activeFilePath">index.html</strong>
                </div>

                <button id="togglePreviewBtn" class="tool-btn simulator-btn"
                    title="Buka Simulator">
                    📱
                </button>

                <button id="saveBtn" class="tool-btn save-btn"
                    title="Simpan">
                    ✓
                </button>
            </div>

            <div class="editor-content">

                <aside class="file-drawer" id="fileDrawer">
                    <div class="drawer-heading">
                        <span>EXPLORER</span>
                        <button id="closeDrawerBtn">×</button>
                    </div>

                    <div class="project-name">📁 MY PROJECT</div>

                    <button class="file-item active" data-file="html">
                        🌐 index.html
                    </button>

                    <button class="file-item" data-file="css">
                        🎨 style.css
                    </button>

                    <button class="file-item" data-file="js">
                        ⚡ script.js
                    </button>
                </aside>

                <div class="code-area">
                    <div class="editor-tab">
                        <span id="tabName">🌐 index.html</span>
                        <span id="saveStatus">Tersimpan</span>
                    </div>

                    <textarea
                        id="codeEditor"
                        spellcheck="false"
                        autocapitalize="off"
                        autocomplete="off"
                        autocorrect="off"
                        placeholder="Tulis kode di sini..."
                    ></textarea>

                    <div class="editor-footer">
                        <span id="languageLabel">HTML</span>
                        <span>Faiz Code Studio 1.0</span>
                    </div>
                </div>

            </div>
        </section>

        <section class="preview-panel" id="previewPanel">

            <div class="preview-toolbar">
                <div>
                    <strong>Simulator</strong>
                    <span>Live Preview</span>
                </div>

                <div class="preview-actions">
                    <button id="reloadBtn" title="Jalankan ulang">↻</button>
                    <button id="closePreviewBtn" title="Tutup">×</button>
                </div>
            </div>

            <div class="phone-stage">
                <div class="phone-frame">
                    <div class="phone-notch"></div>
                    <iframe
                        id="previewFrame"
                        title="Simulator aplikasi"
                        sandbox="allow-scripts allow-forms allow-modals"
                    ></iframe>
                </div>
            </div>

        </section>

    </main>

    <script src="./script.js"></script>
</body>
</html>
