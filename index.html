
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#090e1b">
    <title>Faiz Code Studio</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

<header class="topbar">
    <div class="brand">
        <div class="brand-logo">F</div>
        <div>
            <strong>Faiz Code Studio</strong>
            <small>Web Development Studio</small>
        </div>
    </div>

    <div class="top-actions">
        <select id="projectSelect" aria-label="Pilih project"></select>
        <button id="newProjectBtn" class="top-btn">+ Project</button>
        <button id="runBtn" class="run-btn">▶ Run</button>
    </div>
</header>

<main class="workspace">

    <!-- EDITOR -->
    <section class="editor-panel">

        <div class="editor-toolbar">
            <button id="fileMenuBtn" class="folder-toggle" title="Buka File Explorer">
                <span>📁</span>
            </button>

            <div class="breadcrumb">
                <span>PROJECT</span>
                <span>/</span>
                <strong id="activeFilePath">Belum ada file</strong>
            </div>

            <button id="saveBtn" class="save-btn" title="Simpan">
                ✓
            </button>
        </div>

        <!-- FILE DRAWER -->
        <aside id="fileDrawer" class="file-drawer">

            <div class="drawer-header">
                <div>
                    <strong>Explorer</strong>
                    <small id="drawerProjectName">Project Files</small>
                </div>

                <button id="closeDrawerBtn" class="close-btn">×</button>
            </div>

            <div class="drawer-actions">
                <button id="addFileBtn">＋ File</button>
                <button id="addFolderBtn">＋ Folder</button>
            </div>

            <div id="fileTree" class="file-tree"></div>

            <div class="drawer-footer">
                <span>LOCAL PROJECT</span>
                <span>● Saved</span>
            </div>

        </aside>

        <!-- TABS -->
        <div id="editorTabs" class="editor-tabs"></div>

        <!-- CODE AREA -->
        <div class="code-area">
            <div id="lineNumbers" class="line-numbers">1</div>

            <textarea
                id="codeEditor"
                spellcheck="false"
                autocapitalize="off"
                autocomplete="off"
                autocorrect="off"
                wrap="off"
                placeholder="Pilih file untuk mulai coding..."
                disabled
            ></textarea>
        </div>

        <footer class="editor-status">
            <span id="saveStatus">Ready</span>
            <span id="languageStatus">No file</span>
            <span>UTF-8</span>
        </footer>

    </section>

    <!-- PHONE SIMULATOR -->
    <section class="preview-panel">

        <div class="preview-toolbar">
            <div>
                <span class="live-dot"></span>
                <strong>Live Preview</strong>
            </div>

            <div class="preview-actions">
                <button id="reloadBtn" title="Refresh preview">↻</button>
                <button id="fullscreenBtn" title="Perbesar simulator">⛶</button>
            </div>
        </div>

        <div class="device-stage">

            <div class="phone-frame">

                <div class="phone-top">
                    <span>9:41</span>
                    <span>● ● ● ▰</span>
                </div>

                <div class="phone-camera"></div>

                <div class="phone-screen">
                    <iframe
                        id="previewFrame"
                        title="Phone Simulator"
                        sandbox="allow-scripts allow-forms"
                    ></iframe>
                </div>

                <div class="phone-bottom">
                    <div class="phone-home"></div>
                </div>

            </div>

        </div>

        <div class="preview-status">
            <span>ANDROID PREVIEW</span>
            <span id="previewStatus">Waiting for code</span>
        </div>

    </section>

</main>

<!-- MODAL -->
<div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal-box">

        <div class="modal-heading">
            <div>
                <span class="modal-kicker">FAIZ CODE STUDIO</span>
                <h2 id="modalTitle">Buat File Baru</h2>
            </div>

            <button id="modalCloseBtn" class="close-btn">×</button>
        </div>

        <label for="modalInput">Nama</label>
        <input id="modalInput" type="text" placeholder="Contoh: index.html">

        <div id="modalHint" class="modal-hint">
            Masukkan nama file.
        </div>

        <div class="modal-buttons">
            <button id="modalCancelBtn" class="cancel-btn">Batal</button>
            <button id="modalConfirmBtn" class="confirm-btn">Buat</button>
        </div>

    </div>
</div>

<div id="toast" class="toast"></div>

<script src="./script.js"></script>
</body>
</html>
