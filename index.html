
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faiz Code Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <div class="logo">FAIZ CODE STUDIO</div>
    <button class="run-btn" onclick="runCode()">▶ RUN</button>
</header>

<main class="workspace">

    <section class="editor">
        <div class="tabs">
            <button class="tab active" onclick="openTab('html')">HTML</button>
            <button class="tab" onclick="openTab('css')">CSS</button>
            <button class="tab" onclick="openTab('js')">JS</button>
        </div>

        <textarea id="htmlCode"><h1>Halo Faiz!</h1>
<p>Selamat datang di Faiz Code Studio.</p></textarea>

        <textarea id="cssCode" hidden>body {
    font-family: Arial;
    text-align: center;
    padding: 20px;
}

h1 {
    color: blue;
}</textarea>

        <textarea id="jsCode" hidden>console.log("Halo Faiz!");</textarea>
    </section>

    <section class="preview">
        <div class="preview-title">PHONE SIMULATOR</div>
        <div class="phone">
            <iframe id="previewFrame"></iframe>
        </div>
    </section>

</main>

<script src="script.js"></script>
</body>
</html>
