
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faiz Code Studio</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <header class="topbar">
        <button id="menuBtn" class="icon-btn">☰</button>

        <div class="brand">
            <span class="brand-icon">F</span>
            <span>Faiz Code Studio</span>
        </div>

        <select id="projectSelect">
            <option value="">Pilih Project</option>
        </select>

        <button id="runBtn" class="run-btn">▶ Run</button>
    </header>

    <main class="app-layout">

        <!-- FILE EXPLORER -->
        <aside id="sidebar" class="sidebar">

            <div class="panel-heading">
                <span>EXPLORER</span>
                <button id="newProjectBtn">+ Project</button>
            </div>

            <div class="project-heading">
                <span>PROJECT FILES</span>
                <div>
                    <button id="newFolderBtn" title="Folder baru">📁+</button>
                    <button id="newFileBtn" title="File baru">📄+</button>
                </div>
            </div>

            <div id="fileTree" class="file-tree">
                <p class="empty-message">Belum ada project.</p>
            </div>

        </aside>

        <!-- CODE EDITOR -->
        <section class="editor-panel">

            <div class="editor-heading">
                <span>CODE EDITOR</span>
                <span id="activeFilePath">Belum ada file</span>
            </div>

            <div id="editorTabs" class="editor-tabs"></div>

            <div class="editor-container">
                <div id="lineNumbers" class="line-numbers">1</div>
                <textarea
                    id="codeEditor"
                    spellcheck="false"
                    autocapitalize="off"
                    autocomplete="off"
                    placeholder="Pilih atau buat file untuk mulai coding..."
                ></textarea>
            </div>

            <div class="editor-footer">
                <span id="saveStatus">Siap</span>
                <span>HTML / CSS / JS</span>
            </div>

        </section>

        <!-- PHONE SIMULATOR -->
        <section class="preview-panel">

            <div class="preview-heading">
                <span>PHONE PREVIEW</span>
                <button id="reloadBtn">↻</button>
            </div>

            <div class="phone-area">

                <div class="phone-frame">

                    <div class="phone-notch"></div>

                    <div class="phone-screen">
                        <iframe
                            id="previewFrame"
                            title="Simulasi tampilan website"
                            sandbox="allow-scripts allow-forms"
                        ></iframe>
                    </div>

                    <div class="phone-home"></div>

                </div>

            </div>

            <div class="preview-footer">
                <span>LIVE SIMULATOR</span>
                <span>Mobile View</span>
            </div>

        </section>

    </main>

    <!-- MODAL -->
    <div id="modalOverlay" class="modal-overlay hidden">

        <div class="modal-box">
            <h3 id="modalTitle">Buat baru</h3>

            <input
                id="modalInput"
                type="text"
                placeholder="Masukkan nama..."
            >

            <div class="modal-actions">
                <button id="cancelModalBtn">Batal</button>
                <button id="confirmModalBtn">Buat</button>
            </div>
        </div>

    </div>

    <!-- NOTIFICATION -->
    <div id="toast" class="toast"></div>

    <script src="./script.js"></script>

</body>
</html>
